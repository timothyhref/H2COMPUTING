<!doctype html>
<head>
    <title>Arrival</title>
</head>
<body>
    <table border = 1>
        <tr>
            <th>Time (that is, arrival time)</th>
            <th>From (that is, departure location)</th>
            <th>Flight (that is, flight number)</th>
        </tr>
        {% for item in data %}
        <tr>
            <td>{{item[0]}}</td>
            <td>{{item[1]}}</td>
            <td>{{item[2]}}</td>
        </tr>
        {% endfor %}
    </table>
</body>

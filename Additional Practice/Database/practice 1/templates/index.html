<!doctype html>
<head>
<title>School Bookstore</title>
</head>
<body>
<table border = 1>
<tr><th>Book ID</th><th>Title</th><th>Author</th><th>Price</th></tr>
{% for book in books %}
<tr>
<td>{{book[0]}}</td>
<td>{{book[1]}}</td>
<td>{{book[2]}}</td>
<td>{{'{:.2f}'.format(book[3])}}</td>
</tr>
{% endfor %}

</table>
</body>
